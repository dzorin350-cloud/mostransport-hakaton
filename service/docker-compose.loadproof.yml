# Isolated API instance and its database for concurrent ingest/read and recovery tests.
# Run with a unique Compose project name; never point this at production volumes.
# docker compose -p tram-load-proof -f docker-compose.yml -f docker-compose.loadproof.yml up -d --build api
services:
  api:
    ports: !override
      - "8124:8000"
    environment:
      CHECK_SECONDS: "2"
      REFRESH_HOURS: "24"
  web:
    profiles: ["not-needed-for-loadproof"]
