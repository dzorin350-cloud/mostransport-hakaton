services:
  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: service/api/Dockerfile
    ports:
      - "8123:8000"
    # ТЗ: сервис — один контейнер 2-4 vCPU / 2-4 ГБ RAM. По умолчанию — максимум (4 vCPU / 4 ГБ, 4 воркера);
    # минимальная конфигурация (2 vCPU / 2 ГБ, 2 воркера): docker-compose.2cpu.yml.
    environment:
      WORKERS: "4"
      # Погода. forecast — прод (прогноз Open-Meteo на 16 дней вперёд от сегодня).
      # demo — ТОЛЬКО ДЛЯ ДЕМОНСТРАЦИИ на этом стенде: данные до 31.10.2025, настоящего прогноза на ноябрь 2025 нет,
      # поэтому первые 16 дней горизонта корректируются по фактической погоде из архива. В сабмите погода не используется.
      WEATHER_MODE: "demo"
      # Оперативные экраны используют текущие дату и время Москвы.
      NOW_MODE: "real"
      # Демо экрана «Качество прогноза»: прогнозы по истории до этих дат сравниваются с реальным октябрём 2025
      # (как при еженедельных обновлениях). Основной прогноз и сабмит не меняются. В проде — пусто.
      DEMO_ACCURACY_CUTOFFS: "2025-09-30,2025-10-07,2025-10-14,2025-10-21"
      # Пользователи, журнал решений диспетчера и журнал приёма данных — PostgreSQL (контейнер db).
      DATABASE_URL: postgresql://tram:${TRAM_DB_PASSWORD:-tram-local-only}@db:5432/tram
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    # история валидаций: новые файлы route;date;hour;boardings в ../labels подхватываются движком без перезапуска
    volumes:
      - ../labels:/app/history:ro
      - ingest:/app/ingest           # данные, принятые через POST /ingest/* (переживают перезапуск)
      - auth:/app/auth               # секрет токенов (если не задан AUTH_SECRET)
      - state:/app/state             # версии прогноза, архив и кэш переживают пересоздание контейнера
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s

  web:
    build:
      context: ..
      dockerfile: service/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tram
      POSTGRES_USER: tram
      POSTGRES_PASSWORD: ${TRAM_DB_PASSWORD:-tram-local-only}   # в проде задать TRAM_DB_PASSWORD
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tram -d tram"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  ingest:
  auth:
  state:
