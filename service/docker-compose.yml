services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8123:8000"
    # ТЗ: сервис — один контейнер 2-4 vCPU / 2-4 ГБ RAM. По умолчанию — максимум (4 vCPU / 4 ГБ, 4 воркера);
    # минимальная конфигурация (2 vCPU / 2 ГБ, 2 воркера): docker-compose.2cpu.yml.
    environment:
      WORKERS: "4"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
