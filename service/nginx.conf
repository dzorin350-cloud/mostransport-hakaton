server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Проксируем API через тот же origin — фронт обращается к /api/*,
    # что снимает необходимость в CORS и жёстко зашитых адресах API
    # в прод-развёртывании (в локальной разработке фронт бьёт напрямую
    # в http://127.0.0.1:8123, см. API_BASE в index.html).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
