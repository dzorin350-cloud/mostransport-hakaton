# Optional shared metadata store. Forecast matrices remain immutable Parquet in the state volume.
# docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
services:
  api:
    environment:
      DATABASE_URL: postgresql://tram:${TRAM_DB_PASSWORD:-tram-local-only}@db:5432/tram
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tram
      POSTGRES_USER: tram
      POSTGRES_PASSWORD: ${TRAM_DB_PASSWORD:-tram-local-only}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tram -d tram"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:
